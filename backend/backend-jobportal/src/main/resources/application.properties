spring.application.name=jobportal
logging.pattern.console:${CONSOLE_LOG_PATTERN:%green(%d{HH:mm:ss.SSS}) %blue(%-5level) %red([%thread]) %yellow(%logger{15}) - %cyan(%msg%n)}
#logging.level.root=${LOG_LEVEL:INFO}
logging.level.com.sp.jobportal=${LOG_LEVEL:DEBUG}
logging.group.jobportal_error=com.sp.jobportal.company.controller, com.sp.jobportal.contact.controller
logging.level.jobportal_error=${LOG_LEVEL_ERROR:ERROR}
logging.file.name=logs/jobportal.log
# ===============================
# DATASOURCE
# ===============================
spring.datasource.url=jdbc:postgresql://localhost:5433/mydb
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=myuser
spring.datasource.password=mypassword
# ===============================
# SQL INIT
# ===============================
spring.sql.init.mode=never
# ===============================
# JPA / HIBERNATE
# ===============================
spring.jpa.show-sql=true
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=update
# Hibernate properties
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.defer-datasource-initialization=true
# ===============================
# docker lifecycle commands:
# ===============================
spring.docker.compose.lifecycle-management=start-and-stop
spring.docker.compose.start.command=up
spring.docker.compose.stop.command=stop
# ===============================
#Redis Properties
# ===============================
spring.cache.type=redis
spring.cache.cache-names=jobs,companies,roles
cache.jobs.ttl-minutes=12
cache.jobs.max-size=5000
cache.companies.ttl-minutes=13
cache.companies.max-size=500
cache.roles.ttl-days=1
cache.roles.max-size=100
# ===============================
#upload image
# ===============================
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB
# ===============================
#CORS Configuration
# ===============================
app.cors.allowed-origins=http://localhost:5173/
app.cors.allowed-methods=*
app.cors.allowed-headers=*
app.cors.allowed-credentials=true
app.cors.max-age=3700
# ===============================
#Spring boot actuator configuration
# ===============================
management.endpoint.health.show-details=always
management.server.port=9090
management.endpoints.web.base-path=/jobportal/actuator
management.endpoints.web.exposure.include=*
management.info.env.enabled=true
management.endpoint.shutdown.access= unrestricted
info.app.name=${spring.application.name}
info.app.description=Backend Project for Job Portal backend application
info.app.version=1.0.0
info.app.contact.email=support@jobportal.com
info.developer.name=EazyBytes

# ===============================
#OpenTelemetry Configuration
# ===============================
management.otlp.metrics.export.url=http://localhost:4318/v1/metrics
management.otlp.metrics.export.step=10s

management.opentelemetry.tracing.export.otlp.endpoint=http://localhost:4318/v1/traces
management.tracing.sampling.probability=1.0

management.opentelemetry.logging.export.otlp.endpoint=http://localhost:4318/v1/logs

